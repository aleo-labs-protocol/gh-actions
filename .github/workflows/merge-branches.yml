# Keeps one pull request open from each source branch into the target while the
# source has commits the target lacks. Conflicts are committed with their
# markers, labelled, and the pull request is a draft until people resolve them.
# A caller's post-merge script can resolve its own conflicts first.
#
# Usage and setup: "Merging branches" in README.md.
name: merge-branches

on:
  workflow_call:
    inputs:
      target:
        description: The branch that pull requests merge into.
        type: string
        required: true
      sources:
        description: >-
          Space-separated branches to merge into the target. A source with a
          glob character, such as release/*, stands for every branch it
          matches, which may be none.
        type: string
        required: true
      post-merge:
        description: >-
          An executable on the target branch, as a path from the repository
          root, that runs after each merge and before its commit. See README.md.
        type: string
        default: ''
    secrets:
      # Not required: the caller's job has no environment, so the value it
      # passes is empty. The merge job sets the environment and receives the
      # environment's value; a missing key fails the app-token step.
      MERGE_BOT_APP_KEY:
        required: false

permissions: {}

env:
  REPO: ${{ github.repository }}
  TARGET: ${{ inputs.target }}
  SOURCES: ${{ inputs.sources }}

jobs:
  # Runs without the merge-bot environment, so a run with nothing to merge
  # never loads the app key.
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      pending: ${{ steps.check.outputs.pending }}
    steps:
      - name: Find the sources with commits to merge
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pending=()
          failed=0
          srcs=()
          read -ra patterns <<< "$SOURCES"
          for pat in "${patterns[@]}"; do
            case $pat in
              *[*?[]*)
                if ! names=$(gh api --paginate "repos/$REPO/git/matching-refs/heads/${pat%%[*?[]*}" \
                               --jq '.[].ref | ltrimstr("refs/heads/")'); then
                  echo "::error::could not list the branches matching $pat" >&2
                  failed=1
                  continue
                fi
                # As in a shell `case`, `*` also matches `/`.
                while IFS= read -r name; do
                  # shellcheck disable=SC2053
                  if [ -n "$name" ] && [ "$name" != "$TARGET" ] && [[ $name == $pat ]]; then
                    srcs+=("$name")
                  fi
                done <<< "$names"
                ;;
              *) srcs+=("$pat");;
            esac
          done
          for src in "${srcs[@]}"; do
            if [ "$src" = "$TARGET" ]; then
              echo "::error::$src is both a source and the target" >&2
              exit 1
            fi
            head="ci/merge-$src-into-$TARGET"
            # A failed lookup skips only this source; the run still fails.
            if ! ahead=$(gh api "repos/$REPO/compare/$TARGET...$src" --jq .ahead_by); then
              echo "::error::could not compare $src with $TARGET" >&2
              failed=1
              continue
            fi
            if [ "$ahead" = 0 ]; then
              echo "$src: nothing to merge"
              continue
            fi
            # --head matches a fork's branch of the same name too.
            if ! open=$(gh pr list -R "$REPO" --head "$head" --base "$TARGET" --state open \
                          --json isCrossRepository --jq 'map(select(.isCrossRepository | not)) | length'); then
              echo "::error::could not list pull requests from $head" >&2
              failed=1
              continue
            fi
            if [ "$open" != 0 ] && [ "$(gh api "repos/$REPO/compare/$head...$src" --jq .ahead_by)" = 0 ]; then
              echo "$src: the open pull request already carries $src"
              continue
            fi
            echo "$src: $ahead commit(s) to merge"
            pending+=("$src $head")
          done
          echo "pending=$(jq -cn '[$ARGS.positional[] | split(" ") | {source: .[0], branch: .[1]}]' --args "${pending[@]}")" >> "$GITHUB_OUTPUT"
          exit "$failed"

  merge:
    needs: check
    # Runs for the sources the check job could answer, even if another failed.
    if: ${{ !cancelled() && needs.check.outputs.pending != '' && needs.check.outputs.pending != '[]' }}
    name: Merge ${{ matrix.source }} into ${{ inputs.target }}
    runs-on: ubuntu-latest
    # The caller's environment, which admits only runs on the target branch, so
    # a workflow on any other branch cannot read the app key.
    environment: merge-bot
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.pending) }}
    env:
      SOURCE: ${{ matrix.source }}
      BRANCH: ${{ matrix.branch }}
    steps:
      # A push made with github.token starts no workflows, so CI would never run
      # on the pull request. `workflows: write` lets the merge commit carry
      # changes to .github/workflows.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.MERGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_BOT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      # Keeps no credentials, so the post-merge step has none to read. The
      # merge step installs a helper that answers only where GH_TOKEN is set.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0
          filter: blob:none
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - name: Merge the source without committing
        id: merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          POST_MERGE: ${{ inputs.post-merge }}
        run: |
          set -euo pipefail
          # The token is read when git asks, so git authenticates only in a step
          # whose env has GH_TOKEN: the partial clone's fetches here, and the
          # push. The config holds no token.
          # ci.yml runs this line on a real runner.
          # shellcheck disable=SC2016
          helper='!f() { if [ "$1" = get ] && [ -n "${GH_TOKEN:-}" ]; then printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; fi; }; f'
          git config "credential.$GITHUB_SERVER_URL.helper" "$helper"
          # Paths reach the post-merge script and the pull request unquoted.
          git config core.quotePath false

          bot="${APP_SLUG}[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)+$bot@users.noreply.github.com"

          src=$(git rev-parse "origin/$SOURCE")
          # --head matches a fork's branch of the same name too.
          pr=$(gh pr list --head "$BRANCH" --base "$TARGET" --state open --json number,isCrossRepository \
                 --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')
          if [ -n "$pr" ]; then
            # Builds on the branch as people left it, so a pushed conflict
            # resolution is never overwritten.
            base=$BRANCH
            lease=
          else
            # With no open pull request, a branch left by a closed one is
            # replaced, unless someone pushed to it after this run fetched it.
            base=$TARGET
            lease="refs/heads/$BRANCH:$(git rev-parse -q --verify "refs/remotes/origin/$BRANCH" || true)"
          fi
          { echo "pr=$pr"; echo "lease=$lease"; } >> "$GITHUB_OUTPUT"

          dir="$RUNNER_TEMP/merge-branches"
          mkdir -p "$dir"
          if [ -n "$POST_MERGE" ]; then
            # From the target, never from the pull request's branch or the
            # source, which people can push to without review.
            if [ "$(git ls-tree "origin/$TARGET" -- "$POST_MERGE" | cut -d' ' -f1)" != 100755 ]; then
              echo "::error::post-merge: $POST_MERGE is not an executable file on $TARGET" >&2
              exit 1
            fi
            git show "origin/$TARGET:$POST_MERGE" > "$dir/post-merge"
            chmod +x "$dir/post-merge"
          fi

          git checkout -B "$BRANCH" "origin/$base"
          if git merge-base --is-ancestor "$src" HEAD; then
            echo "$BRANCH already contains $SOURCE"
            exit 0
          fi
          clean=true
          git merge --no-ff --no-commit "$src" || clean=false
          git diff --name-only --diff-filter=U > "$dir/conflicts"
          if [ "$clean" = false ] && [ ! -s "$dir/conflicts" ]; then
            echo "::error::git merge failed without reporting a conflict" >&2
            exit 1
          fi
          git rev-parse HEAD MERGE_HEAD > "$dir/heads"
          if [ -n "$POST_MERGE" ]; then
            # The tree the commit would hold without the post-merge script, so
            # the push step can name what the script changed.
            cp "$(git rev-parse --git-path index)" "$dir/index"
            GIT_INDEX_FILE="$dir/index" git add -A
            echo "tree=$(GIT_INDEX_FILE="$dir/index" git write-tree)" >> "$GITHUB_OUTPUT"
          fi
          echo merged=true >> "$GITHUB_OUTPUT"

      # Runs with no token. It is not a sandbox: the script shares the runner
      # and the checkout with the push step.
      - name: Run the post-merge script
        if: steps.merge.outputs.merged == 'true' && inputs.post-merge != ''
        env:
          POST_MERGE: ${{ inputs.post-merge }}
        run: |
          set -euo pipefail
          mapfile -t conflicts < "$RUNNER_TEMP/merge-branches/conflicts"
          if ! "$RUNNER_TEMP/merge-branches/post-merge" "${conflicts[@]}"; then
            echo "::error::post-merge: $POST_MERGE failed" >&2
            exit 1
          fi
          if ! { git rev-parse -q --verify HEAD; git rev-parse -q --verify MERGE_HEAD; } | cmp -s - "$RUNNER_TEMP/merge-branches/heads"; then
            echo "::error::post-merge: $POST_MERGE committed, aborted or replaced the merge" >&2
            exit 1
          fi

      - name: Commit, push, and open or update the pull request
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          POST_MERGE: ${{ inputs.post-merge }}
          PR: ${{ steps.merge.outputs.pr }}
          LEASE: ${{ steps.merge.outputs.lease }}
          TREE: ${{ steps.merge.outputs.tree }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/merge-branches"
          label=merge-conflict
          pr=$PR
          src=$(git rev-parse MERGE_HEAD)
          new_commits=$(git rev-list "HEAD..$src")

          # A modify/delete, rename or binary conflict leaves no markers, and
          # `git add -A` then keeps one side silently, so the unmerged paths are
          # recorded before staging.
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if [ -n "$POST_MERGE" ]; then
            # What the post-merge script resolved without editing. A path it
            # staged with markers still in it is not resolved.
            : > "$dir/resolved"
            while IFS= read -r path; do
              if [ -f "$path" ] && grep -qE '^(<<<<<<<|>>>>>>>)( |$)' "./$path"; then
                conflicts+=("$path")
              else
                echo "$path" >> "$dir/resolved"
              fi
            done < <(LC_ALL=C comm -23 "$dir/conflicts" <(printf '%s\n' "${conflicts[@]}"))
          fi
          git add -A
          changed=()
          note=
          if [ -n "$POST_MERGE" ]; then
            # Plus what it edited.
            mapfile -t changed < <(git diff --no-renames --name-only "$TREE" "$(git write-tree)" | LC_ALL=C sort -u - "$dir/resolved")
          fi
          if [ "${#changed[@]}" != 0 ]; then
            note="

          Changed by \`$POST_MERGE\`:
          $(printf -- "- \`%s\`\n" "${changed[@]}")"
          fi

          subject="Merge $SOURCE into $TARGET"
          warning=
          draft=()
          {
            echo "$subject"
            if [ "${#changed[@]}" != 0 ]; then
              printf "\nChanged by \`%s\`:\n" "$POST_MERGE"
              printf '    %s\n' "${changed[@]}"
            fi
            if [ "${#conflicts[@]}" != 0 ]; then
              printf '\nCommitted with these paths unresolved:\n'
              printf '    %s\n' "${conflicts[@]}"
            fi
          } | git -c core.hooksPath=/dev/null commit -F -
          if [ "${#conflicts[@]}" != 0 ]; then
            # Gated before the push: once the branch carries the source, the
            # next run has nothing to redo.
            gh label create "$label" --force --color B60205 --description "Committed with unresolved merge conflicts"
            if [ -n "$pr" ]; then
              gh pr edit "$pr" --add-label "$label"
              gh pr ready "$pr" --undo
            fi
            draft=(--draft --label "$label")
            warning="

          > [!WARNING]
          > The merge has conflicts. They are committed as git left them, and this pull request is a draft until they are resolved. A delete or binary conflict has no markers, so check every file listed:
          >
          $(printf "> - \`%s\`\n" "${conflicts[@]}")
          >
          > To resolve, check out \`$BRANCH\`, fix these files, and push the fix as its own commit. Then remove the \`$label\` label and mark the pull request ready for review."
          fi

          force=()
          if [ -n "$LEASE" ]; then
            force=(--force-with-lease="$LEASE")
          fi
          # No hook the post-merge script may have installed runs with the token.
          git -c core.hooksPath=/dev/null push "${force[@]}" origin "HEAD:refs/heads/$BRANCH"

          summary="Merges $(wc -l <<< "$new_commits") new commit(s) from \`$SOURCE\` at ${src:0:9}.$note$warning"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "$summary"
          else
            body="Merges \`$SOURCE\` into \`$TARGET\`. Opened by [a run]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID) of the \`$GITHUB_WORKFLOW\` workflow.

          $summary

          Changes on \`$SOURCE\`: $GITHUB_SERVER_URL/$REPO/compare/$TARGET...$SOURCE

          Review is requested from the authors and reviewers of the pull requests these commits came from. When \`$SOURCE\` moves, the workflow merges it into this branch again and never force-pushes, so a resolution pushed here is kept."
            pr=$(gh pr create --head "$BRANCH" --base "$TARGET" --title "$subject" --body "$body" "${draft[@]}" | sed 's|.*/||')
          fi

          # Authors and reviewers of the merged pull requests behind the new
          # commits, or the commit author where a commit has no pull request.
          # Lookups are best effort. On failure `gh api` prints the error body
          # to stdout, so `lookup` drops it.
          lookup() {
            local out
            if out=$(gh api "$@"); then
              printf '%s\n' "$out"
            else
              echo "::warning::lookup failed: gh api $*" >&2
            fi
          }
          logins=$(
            for sha in $new_commits; do
              lookup "repos/$REPO/commits/$sha/pulls" --jq '.[] | select(.merged_at != null) | "\(.number) \(.user.login)"' | grep . \
                || lookup "repos/$REPO/commits/$sha" --jq '.author.login // empty'
            done | sort -u | while read -r n author; do
              # A line with no author is a commit author's login.
              if [ -z "$author" ]; then
                echo "$n"
                continue
              fi
              echo "$author"
              lookup --paginate "repos/$REPO/pulls/$n/reviews" --jq '.[].user.login' | sort -u
            done
          )
          # Most pull requests first, and at most `max` people.
          max=15
          mapfile -t ranked < <(sed -e '/^$/d' -e '/\[bot\]$/d' <<< "$logins" | sort | uniq -c | sort -k1,1nr -k2,2 | awk '{print $2}')
          if [ "${#ranked[@]}" -gt "$max" ]; then
            echo "::warning::requesting review from $max of ${#ranked[@]} people"
          fi
          for login in "${ranked[@]:0:$max}"; do
            gh api "repos/$REPO/pulls/$pr/requested_reviewers" -f "reviewers[]=$login" --silent \
              || echo "::warning::could not request review from $login"
          done
