# Keeps one pull request open that updates Cargo.lock past the crates
# `cargo deny check advisories` reports, and one issue listing the advisories
# such an update cannot fix.
#
# Usage and setup: "Bumping crates with advisories" in README.md.
name: bump-advisories

on:
  workflow_call:
    inputs:
      target:
        description: The branch to check, and that the pull request merges into.
        type: string
        required: true
      cargo-deny:
        description: The cargo-deny release to run.
        type: string
        default: 0.20.2
    secrets:
      # Not required: the caller's job has no environment, so the value it
      # passes is empty. This job sets the environment and receives its value.
      MERGE_BOT_APP_KEY:
        required: false

permissions: {}

env:
  REPO: ${{ github.repository }}
  TARGET: ${{ inputs.target }}
  BRANCH: ci/bump-advisories-into-${{ inputs.target }}

jobs:
  bump:
    runs-on: ubuntu-latest
    # The caller's environment, which admits only runs on the target branch.
    environment: merge-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target }}
          persist-credentials: false

      - name: Install cargo-deny and the toolchain
        env:
          VERSION: ${{ inputs.cargo-deny }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/cargo-deny-$VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" --strip-components=1 --wildcards '*/cargo-deny'
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          rustup toolchain install --profile minimal

      # Runs before the app token exists.
      - name: Update the crates with advisories
        id: bump
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bump-advisories"
          mkdir -p "$dir"
          # One line per error: advisory, crate, version, the crates that
          # depend on it, title.
          findings() { # file, then cargo-deny options
            local out=$1 rc=0
            shift
            cargo deny "$@" --format json check advisories 2> "$dir/deny.json" > /dev/null || rc=$?
            jq -Rr 'fromjson? | select(.type == "diagnostic" and .fields.severity == "error") | .fields as $f
                    | ($f.graphs[0] // {}) as $g
                    | [$f.advisory.id // $f.code, $g.Krate.name // "", $g.Krate.version // "",
                       ([$g.parents[]?.Krate | "\(.name)@\(.version)"] | join(" ")),
                       ($f.advisory.title // $f.message | gsub("^\\s+|\\s+$"; ""))] | @tsv' \
              "$dir/deny.json" > "$dir/$out"
            if [ "$rc" != 0 ] && [ ! -s "$dir/$out" ]; then
              cat "$dir/deny.json" >&2
              echo "::error::cargo deny failed without reporting an advisory" >&2
              exit 1
            fi
          }
          # `cargo update -p foo` unlocks foo's dependencies too. A crate that
          # stays locked but accepts a range, such as windows-sys
          # ">=0.52, <0.62", is then relocked to the lowest version already in
          # Cargo.lock that fits. `repair OLD` points each such edge back at its
          # version in OLD, or the highest locked one above it. It keeps the
          # result if `cargo metadata --locked` accepts it, and otherwise keeps
          # each crate's repair that is accepted alone. `report BASE CHANGES
          # DOWNGRADES` lists what changed since BASE, and the dependencies that
          # moved to a lower version.
          cat > "$dir/lock.py" <<'PY'
          import re, subprocess, sys, tomllib
          from functools import reduce

          def key(v):
              core, _, pre = v.split('+')[0].partition('-')
              return (tuple(int(x) for x in core.split('.')), not pre,
                      tuple((0, int(x), '') if x.isdigit() else (1, 0, x) for x in pre.split('.') if pre))

          def load(path):
              text = open(path).read()
              return text, tomllib.loads(text).get('package', [])

          def pid(p):
              return p['name'], p['version'], p.get('source')

          # Package id -> {dependency name: (entry, package id)}. An entry is
          # "name", "name version" or "name version (source)", whichever is
          # unique in its file. A name a package depends on twice is left out.
          def edges(pkgs):
              by = {}
              for p in pkgs:
                  by.setdefault(p['name'], []).append(pid(p))
              out = {}
              for p in pkgs:
                  deps = {}
                  for e in p.get('dependencies', []):
                      name, ver, src = re.fullmatch(r'(\S+)(?: (\S+))?(?: \((.+)\))?', e).groups()
                      c = [i for i in by.get(name, []) if ver in (None, i[1]) and src in (None, i[2])]
                      deps[name] = None if name in deps or len(c) != 1 else (e, c[0])
                  out[pid(p)] = {n: d for n, d in deps.items() if d}
              return out

          def lower(old, new):
              return old[2] == new[2] and key(new[1]) < key(old[1])

          def repair(old_path):
              old = edges(load(old_path)[1])
              text, pkgs = load('Cargo.lock')
              ids = {pid(p) for p in pkgs}
              fixes = {}
              for parent, deps in edges(pkgs).items():
                  for name, (e, n) in deps.items():
                      o = old.get(parent, {}).get(name, (None, None))[1]
                      if o and lower(o, n):
                          ups = [i[1] for i in ids if i[0] == name and i[2] == n[2] and key(i[1]) >= key(o[1])]
                          if ups:
                              v = o[1] if o[1] in ups else max(ups, key=key)
                              fixes.setdefault(parent, []).append((e, e.replace(f'{name} {n[1]}', f'{name} {v}', 1)))

              def apply(text, parent):
                  head = re.escape(f'\n[[package]]\nname = "{parent[0]}"\nversion = "{parent[1]}"\n'
                                   + (f'source = "{parent[2]}"\n' if parent[2] else ''))
                  m = re.search(head + r'(?!source = )(?:.+\n)*', text)
                  if not m:
                      return text
                  block = m.group(0)
                  for e, r in fixes[parent]:
                      block = block.replace(f'\n "{e}",\n', f'\n "{r}",\n')
                  return text[:m.start()] + block + text[m.end():]

              def log(verb, parent):
                  print(f'{verb} {parent[0]} {parent[1]}: ' + ', '.join(f'{e} -> {r}' for e, r in fixes[parent]),
                        file=sys.stderr)

              def accepted(text):
                  open('Cargo.lock', 'w').write(text)
                  return subprocess.run(['cargo', 'metadata', '--locked', '--offline', '--format-version', '1'],
                                        stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0

              if not fixes:
                  return
              if accepted(reduce(apply, fixes, text)):
                  for parent in fixes:
                      log('repaired', parent)
                  return
              for parent in fixes:
                  if accepted(t := apply(text, parent)):
                      text = t
                      log('repaired', parent)
                  else:
                      log('cannot repair', parent)
              open('Cargo.lock', 'w').write(text)

          def write(path, lines, n=200):
              lines = sorted(lines)
              if len(lines) > n:
                  lines = lines[:n] + [f'- and {len(lines) - n} more']
              open(path, 'w').write(''.join(f'{x}\n' for x in lines))

          def report(base_path, changes, downgrades):
              base, final = load(base_path)[1], load('Cargo.lock')[1]
              was, ids = {pid(p) for p in base}, {pid(p) for p in final}
              gone, added = was - ids, ids - was
              lines = []  # (line, whether it is a downgrade)
              for name in {i[0] for i in gone | added}:
                  r, a = [i for i in gone if i[0] == name], [i for i in added if i[0] == name]
                  if len(r) == len(a) == 1:
                      lines.append((f'- `{name}` {r[0][1]} → {a[0][1]}', lower(r[0], a[0])))
                  else:
                      lines += [(f'- `{name}` {i[1]} added', False) for i in a]
                      lines += [(f'- `{name}` {i[1]} removed', False) for i in r]
              old, new = edges(base), edges(final)
              for parent in old.keys() & new.keys():
                  for name in old[parent].keys() & new[parent].keys():
                      o, n = old[parent][name][1], new[parent][name][1]
                      # A dependency that was itself updated is listed above.
                      if o != n and o in ids:
                          lines.append((f'- `{parent[0]} {parent[1]}` depends on `{name}` {n[1]}, not {o[1]}', lower(o, n)))
              write(changes, [x for x, _ in lines])
              write(downgrades, [x for x, d in lines if d])

          {'repair': repair, 'report': report}[sys.argv[1]](*sys.argv[2:])
          PY
          cp Cargo.lock "$dir/base.lock"
          # Kept only if it leaves fewer findings, so an update that fixes
          # nothing stays out of the pull request.
          try() {
            # An earlier update may have moved it.
            cargo pkgid "$1" > /dev/null 2>&1 || return 0
            cp Cargo.lock "$dir/Cargo.lock"
            cargo update -p "$1"
            # An updated crate is not downloaded yet, and --offline cannot fetch it.
            cargo fetch
            python3 "$dir/lock.py" repair "$dir/Cargo.lock"
            findings next --offline
            if [ "$(wc -l < "$dir/next")" -lt "$(wc -l < "$dir/after")" ]; then
              mv "$dir/next" "$dir/after"
            else
              cp "$dir/Cargo.lock" Cargo.lock
            fi
          }
          findings before
          cp "$dir/before" "$dir/after"
          # The crate itself, then the crates that depend on what is left.
          mapfile -t crates < <(awk -F'\t' '$2 != "" { print $2 "@" $3 }' "$dir/after" | sort -u)
          for p in "${crates[@]}"; do try "$p"; done
          mapfile -t parents < <(cut -f4 "$dir/after" | tr ' ' '\n' | sed '/^$/d' | sort -u)
          for p in "${parents[@]}"; do try "$p"; done
          awk -F'\t' 'FILENAME == ARGV[1] { left[$1 FS $2 FS $3]; next } !(($1 FS $2 FS $3) in left)' "$dir/after" "$dir/before" > "$dir/fixed"
          python3 "$dir/lock.py" report "$dir/base.lock" "$dir/changes" "$dir/downgrades"
          echo "Before:"; cat "$dir/before"; echo "After:"; cat "$dir/after"
          echo "Changes:"; cat "$dir/changes"; echo "Downgrades:"; cat "$dir/downgrades"
          git diff --quiet -- Cargo.lock || echo changed=true >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.MERGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_BOT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          # The rebuilt branch can carry the target's own workflow changes.
          permission-workflows: write

      - name: Open, update or close the pull request and the issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          CHANGED: ${{ steps.bump.outputs.changed }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bump-advisories"
          label=cargo-advisories
          title="cargo deny advisories on $TARGET"
          list() {
            awk -F'\t' '{ id = $1 ~ /^RUSTSEC-/ ? "[" $1 "](https://rustsec.org/advisories/" $1 ".html)" : $1
                          printf "- %s in `%s %s`: %s\n", id, $2, $3, $5 }' "$1"
          }

          bot="${APP_SLUG}[bot]"
          fixed=$(list "$dir/fixed")
          # What the pull request, or a comment on it, says the update does.
          summary="$fixed

          Changes:

          $(cat "$dir/changes")

          "
          if [ -s "$dir/downgrades" ]; then
            summary+="These are on a lower version than on \`$TARGET\`, and the workflow could not move them back:

          $(cat "$dir/downgrades")

          "
          fi
          unneeded="\`$TARGET\` no longer needs this update."

          # --head matches a fork's branch of the same name too.
          pr=$(gh pr list --head "$BRANCH" --base "$TARGET" --state open --json number,isCrossRepository \
                 --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')
          # The workflow pushes one commit of its own. A tip that someone else
          # wrote or committed hands the branch to them: the workflow neither
          # force-pushes over it nor closes it.
          theirs() {
            [ -n "$(BOT=$bot gh api "repos/$REPO/commits/$BRANCH" \
                      --jq 'select(.author.login != env.BOT or .committer.login != env.BOT) | .sha')" ]
          }
          # Comments once per result, not once per run. The marker names the
          # Cargo.lock this run computed, or `none` when the target needs none.
          comment_once() { # marker, body
            local marker="<!-- bump-advisories: $1 -->" bodies
            # Not piped: grep -q exits at the first match, and under pipefail
            # gh's SIGPIPE would read as no match.
            bodies=$(gh api "repos/$REPO/issues/$pr/comments" --paginate --jq '.[].body')
            if grep -qxF -- "$marker" <<< "$bodies"; then
              echo "#$pr already has this comment"
            else
              gh pr comment "$pr" --body "$2

          $marker"
            fi
          }
          if [ "$CHANGED" = true ]; then
            lock=$(git hash-object Cargo.lock)
            if [ -n "$pr" ] && [ "$(gh api "repos/$REPO/contents/Cargo.lock?ref=$BRANCH" --jq .sha)" = "$lock" ]; then
              echo "#$pr already holds this Cargo.lock"
            elif [ -n "$pr" ] && theirs; then
              comment_once "$lock" "\`$TARGET\` now needs a different \`Cargo.lock\`. Someone else has pushed to this branch, so the workflow does not rebuild it. Close this pull request, and the next run rebuilds the branch and opens a new one.

          It would fix:

          $summary"
            else
              # ci.yml runs this line on a real runner.
              # shellcheck disable=SC2016
              helper='!f() { if [ "$1" = get ] && [ -n "${GH_TOKEN:-}" ]; then printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; fi; }; f'
              git config "credential.$GITHUB_SERVER_URL.helper" "$helper"
              git config user.name "$bot"
              git config user.email "$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)+$bot@users.noreply.github.com"
              subject="Bump crates with security advisories"
              git -c core.hooksPath=/dev/null checkout -B "$BRANCH"
              printf '%s\n\nFixes:\n%s\n' "$subject" "$fixed" | git -c core.hooksPath=/dev/null commit -F - -- Cargo.lock
              # Rebuilt from the target on every run that changes it.
              git -c core.hooksPath=/dev/null push --force origin "HEAD:refs/heads/$BRANCH"
              body="Updates \`Cargo.lock\` on \`$TARGET\` past these \`cargo deny check advisories\` findings:

          ${summary}Opened by [a run]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID) of the \`$GITHUB_WORKFLOW\` workflow. Each run that changes the result rebuilds this branch from \`$TARGET\` and force-pushes it. Once someone else pushes to the branch, the workflow comments instead."
              if [ -n "$pr" ]; then
                gh pr edit "$pr" --body "$body"
              else
                gh pr create --head "$BRANCH" --base "$TARGET" --title "$subject" --body "$body"
              fi
            fi
          elif [ -n "$pr" ]; then
            if theirs; then
              comment_once none "$unneeded Someone else has pushed to this branch, so the workflow leaves it open."
            else
              gh pr close "$pr" --delete-branch --comment "$unneeded"
            fi
          fi

          issue=$(TITLE=$title gh issue list --label "$label" --state open --json number,title \
                    --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -s "$dir/after" ]; then
            remaining=$(list "$dir/after")
            body="\`cargo deny check advisories\` reports these on \`$TARGET\`, with the bump pull request applied if one is open. Updating \`Cargo.lock\` does not fix them. Raise a requirement in a \`Cargo.toml\`, or ignore the advisory in \`deny.toml\` with the reason.

          $remaining

          The \`$GITHUB_WORKFLOW\` workflow keeps this list current and closes this issue when it is empty."
            gh label create "$label" --force --color B60205 --description "cargo deny advisories that Cargo.lock updates cannot fix"
            if [ -z "$issue" ]; then
              gh issue create --title "$title" --label "$label" --body "$body"
            else
              old=$(gh issue view "$issue" --json body --jq .body)
              if [ "$old" != "$body" ]; then
                gh issue edit "$issue" --body "$body"
                # An edit notifies nobody; a comment does. New means an
                # advisory and crate the old list lacks.
                # shellcheck disable=SC2016
                key() { sed -nE 's/^- \[?([^] ]+)[^`]* in `([^ ]+) .*/\1 \2/p'; }
                was=$(key <<< "$old")
                new=$(while IFS= read -r l; do
                        grep -qxF -- "$(key <<< "$l")" <<< "$was" || printf '%s\n' "$l"
                      done <<< "$remaining")
                if [ -n "$new" ]; then
                  gh issue comment "$issue" --body "New since the last run:

          $new"
                fi
              fi
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "No advisory is left that updating \`Cargo.lock\` cannot fix."
          fi
